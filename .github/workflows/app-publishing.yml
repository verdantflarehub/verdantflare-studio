name: App Publishing Relay

on:
  push:
    branches: [release]
    paths:
      - cmd/app-publishing-relay/**
      - Dockerfile.app-publishing
      - go.mod
      - go.sum
      - .github/workflows/app-publishing.yml

permissions:
  contents: read

concurrency:
  group: app-publishing-release
  cancel-in-progress: false

env:
  IMAGE_VERSION: app-publishing-v0.1.0

jobs:
  image:
    name: Build and publish App Publishing relay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Select image
        id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "name=$endpoint/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse existing image tag
        run: '! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}" >/dev/null 2>&1'
      - name: Publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app-publishing
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
